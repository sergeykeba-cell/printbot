# alembic.ini — Конфігурація Alembic для PrintBot Instance Manager
#
# URL БД береться з env (MANAGER_DATABASE_URL) — тут залишаємо порожнім.
# Це запобігає випадковому запуску міграцій без env.
#
# Запуск:
#   alembic upgrade head          ← застосувати всі міграції
#   alembic downgrade -1          ← відкотити одну міграцію
#   alembic revision --autogenerate -m "add_field"  ← нова міграція

[alembic]
# Шлях до директорії з міграціями
script_location = alembic

# URL навмисно порожній — читається з MANAGER_DATABASE_URL в env.py
# sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/manager_db

# Шаблон іменування файлів міграцій
file_template = %%(rev)s_%%(slug)s

# Кодування вихідних файлів
output_encoding = utf-8


[post_write_hooks]
# Автоформатування нових файлів міграцій через black (опціонально)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
