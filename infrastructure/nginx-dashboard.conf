# /etc/nginx/sites-available/printbot-manager
#
# БЕЗПЕКА: API ключ інжектується тут, на серверному боці.
# Браузер НІКОЛИ не бачить X-API-Key — він додається Nginx при проксіюванні.
#
# Налаштування перед запуском:
#   1. Встановити змінну середовища MANAGER_API_KEY для Nginx:
#      В /etc/systemd/system/nginx.service додати:
#        [Service]
#        Environment="MANAGER_API_KEY=your-key-here"
#
#      Або через envsubst при генерації конфігу:
#        envsubst '$MANAGER_API_KEY' < nginx-dashboard.conf.template > /etc/nginx/sites-available/printbot-manager
#
#   2. Отримати SSL: certbot --nginx -d manager.printbot.app
#   3. nginx -t && systemctl reload nginx
#
# ПОРЯДОК ДЕПЛОЮ (перший раз):
#   Якщо Certbot ще не запускався — використовуйте тимчасовий HTTP конфіг:
#
#   server {
#       listen 80;
#       server_name manager.printbot.app;
#       root /opt/printbot/dashboard/dist;
#       index index.html;
#       location / { try_files $uri $uri/ /index.html; }
#       location /api/ {
#           proxy_pass http://127.0.0.1:8080;
#           proxy_set_header X-API-Key "YOUR_KEY_HERE";  # тимчасово, замінити на env
#       }
#   }

# Переменная для API ключа — підставляється через envsubst або nginx env module
# Приклад генерації: envsubst '$MANAGER_API_KEY' < nginx-dashboard.conf > /etc/nginx/sites-available/printbot-manager
# Значення: MANAGER_API_KEY=... з /opt/printbot/manager/.env (той самий ключ)
set $manager_api_key "${MANAGER_API_KEY}";

server {
    listen 80;
    server_name manager.printbot.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name manager.printbot.app;

    # SSL — видає Certbot. Файли з'являються після: certbot --nginx -d manager.printbot.app
    ssl_certificate     /etc/letsencrypt/live/manager.printbot.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manager.printbot.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Статичний React-білд
    root /opt/printbot/dashboard/dist;
    index index.html;

    # SPA fallback — всі невідомі маршрути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── КЛЮЧОВИЙ БЛОК: Проксі до Manager API ─────────────────────
    # X-API-Key додається тут — браузер його не бачить і не може підробити.
    # Значення береться з серверної змінної $manager_api_key.
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ← API ключ інжектується сервером, не браузером
        proxy_set_header   X-API-Key         $manager_api_key;

        proxy_read_timeout 60s;
    }

    # Health check — не логуємо
    location /health {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   X-API-Key $manager_api_key;
        access_log off;
    }

    # Забороняємо доступ до .env файлів (на випадок помилки деплою)
    location ~ /\.env {
        deny all;
        return 404;
    }

    # Забороняємо доступ до прихованих файлів (.git, .htaccess тощо)
    location ~ /\. {
        deny all;
        return 404;
    }
}
